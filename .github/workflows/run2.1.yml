name: 수동 파일_출석체크

on:
  workflow_dispatch: {}

permissions:
  contents: write   # .date/ 캐시 파일들을 저장소에 커밋하려면 필요한 권한

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 10분 넘게 실행되면 자동 취소
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: npm install

      - name: 출석 체크 실행
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: node checkin.js

      - name: 캐시 파일 저장 (커밋 기록 안 쌓이게 마지막 커밋에 덮어씀)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -d .date ]; then
            echo "저장할 파일이 없어 건너뜁니다."
            exit 0
          fi

          git add .date

          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
            exit 0
          fi

          COMMIT_MARKER="chore(auto): update checkin cache [skip ci]"
          LAST_MSG="$(git log -1 --pretty=%B 2>/dev/null || echo '')"

          if [ "$LAST_MSG" = "$COMMIT_MARKER" ]; then
            echo "이전 자동 커밋을 덮어씁니다 (amend)"
            git commit --amend --no-edit
          else
            echo "새 자동 커밋을 만듭니다 (다음부터는 계속 덮어씀)"
            git commit -m "$COMMIT_MARKER"
          fi

          git push origin HEAD:${{ github.ref_name }} --force-with-lease
